alerts:
  - name: HighLatencyP95Warning
    severity: warning
    condition: latency_p95_ms > 3000 for 5m
    type: symptom-based
    owner: Member D (SRE & Alerts Engineer)
    runbook: docs/alerts.md#alert-1

  - name: HighErrorRateCritical
    severity: critical
    condition: error_rate_pct > 2% for 5m
    type: symptom-based
    owner: Member D (SRE & Alerts Engineer)
    runbook: docs/alerts.md#alert-2

  - name: LowQualityScoreOrCostBreach
    severity: warning
    condition: quality_score_avg < 0.75 or daily_cost_usd > 2.5 for 15m
    type: symptom-based
    owner: Member D (SRE & Alerts Engineer)
    runbook: docs/alerts.md#alert-3
